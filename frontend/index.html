<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexiMiner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">LexiMiner</p>
      <h1>英语词汇与短语分析</h1>
      <p class="lead">输入英文文本，快速得到词汇统计、短语提取、词库分层和释义补全结果。现在已经接入你放进参考目录的词库资源。</p>
    </section>

    <section class="stats-strip card" id="vocab-stats">
      <div class="stats-header">
        <div>
          <p class="eyebrow">Vocabulary</p>
          <h2>词库概览</h2>
        </div>
        <button id="refresh-vocab-btn" class="ghost">刷新词库概览</button>
      </div>
      <div id="vocab-stats-grid" class="stats-grid"></div>
      <p id="vocab-stats-note" class="muted">正在读取词库数据...</p>
    </section>

    <section class="panel">
      <label for="text-input">英文文本</label>
      <textarea id="text-input" rows="10">LexiMiner helps students analyze academic reading materials. The system extracts important words and common phrases from English texts.</textarea>

      <label class="file-input">
        <span>上传文件（.txt / .pdf）</span>
        <input type="file" id="file-input" accept=".txt,.pdf">
      </label>

      <div class="actions">
        <label class="toggle">
          <input type="checkbox" id="online-translation">
          <span>联网补充中文释义</span>
        </label>
        <button id="analyze-btn">开始分析</button>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <h2>状态</h2>
        <pre id="status-box">等待分析</pre>
      </article>
      <article class="card">
        <h2>摘要</h2>
        <pre id="summary-box">-</pre>
      </article>
    </section>

    <section class="card">
      <h2>词汇结果</h2>
      <div id="words-box" class="table-box"></div>
    </section>

    <section class="card">
      <h2>短语结果</h2>
      <div id="phrases-box" class="table-box"></div>
    </section>

    <section class="card">
      <h2>导入说明</h2>
      <p>支持直接粘贴英文文本，也支持上传 TXT 或 PDF 文件。词库已合并为本地分层结构，网页上会显示基础词表、考试词表和释义底座的统计结果。</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
